spring.application.name=speedreader

# Database: local MySQL from docker-compose.yml (port 3307, so it doesn't clash with a local MySQL/XAMPP on 3306).
# Override with the environment variables DB_URL, DB_USER, DB_PASSWORD. Integration tests ignore this: Testcontainers sets its own.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/speedreader}
spring.datasource.username=${DB_USER:speedreader}
spring.datasource.password=${DB_PASSWORD:speedreader}

# Schema: Flyway creates it (db/migration), Hibernate only checks that it matches the entities.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
